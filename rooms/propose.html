<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Proposal - Quorum</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .logo {
      font-size: 2rem;
      font-weight: bold;
      color: #ec4899;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: rgba(255,255,255,0.6);
      margin-bottom: 1.5rem;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: rgba(255,255,255,0.6); }
    .info-value { font-weight: 500; font-family: monospace; }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: rgba(255,255,255,0.8);
      font-size: 0.9rem;
    }
    input, textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #ec4899;
    }
    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,0.4);
    }
    .amount-input {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .amount-input input {
      flex: 1;
    }
    .amount-unit {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
    }
    .balance-hint {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      margin-top: 0.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-primary {
      background: #ec4899;
      color: white;
    }
    .btn-primary:hover {
      background: #db2777;
    }
    .btn-primary:disabled {
      background: #6b7280;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
      margin-top: 0.5rem;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
    }
    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: #86efac;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }
    .success h3 {
      margin-bottom: 0.5rem;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 3rem;
      color: rgba(255,255,255,0.6);
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ec4899;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span style="font-size: 1.5rem;">Q</span> Quorum
    </div>

    <!-- Loading State -->
    <div id="loading" class="card">
      <div class="loading">
        <div class="spinner"></div>
        Loading multisig...
      </div>
    </div>

    <!-- Error State -->
    <div id="error" class="card hidden">
      <div class="error" id="errorMessage"></div>
      <button class="btn btn-secondary" onclick="window.history.back()">← Go Back</button>
    </div>

    <!-- Proposal Form -->
    <div id="form" class="hidden">
      <div class="card">
        <h2>Create Spend Proposal</h2>
        <p class="subtitle" id="multisigName">Loading...</p>
        
        <div class="info-row">
          <span class="info-label">From</span>
          <span class="info-value" id="fromAddress">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Balance</span>
          <span class="info-value" id="balance">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Required Signatures</span>
          <span class="info-value" id="threshold">-</span>
        </div>
      </div>

      <div class="card">
        <div class="form-group">
          <label for="recipient">Recipient Address</label>
          <input type="text" id="recipient" placeholder="bc1q..." autocomplete="off">
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <div class="amount-input">
            <input type="number" id="amount" placeholder="0" min="546">
            <span class="amount-unit">sats</span>
          </div>
          <div class="balance-hint">Available: <span id="availableSats">0</span> sats</div>
        </div>

        <div class="form-group">
          <label for="note">Note (optional)</label>
          <textarea id="note" rows="2" placeholder="What's this payment for?"></textarea>
        </div>

        <div class="form-group">
          <label>Visibility</label>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.5rem 1rem; background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
              <input type="radio" name="visibility" value="public" checked> 
              <span>🌐 Public</span>
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.5rem 1rem; background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
              <input type="radio" name="visibility" value="password"> 
              <span>🔒 Password</span>
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.5rem 1rem; background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
              <input type="radio" name="visibility" value="private"> 
              <span>👁️ Private</span>
            </label>
          </div>
          <div style="font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-top: 0.5rem;">
            Public: Anyone can view • Password: Requires password to view • Private: Agents only
          </div>
        </div>

        <div class="form-group hidden" id="passwordGroup">
          <label for="proposalPassword">Password</label>
          <input type="password" id="proposalPassword" placeholder="Enter a password for this proposal">
        </div>

        <button class="btn btn-primary" id="submitBtn" onclick="submitProposal()">
          Create Proposal
        </button>
        <button class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
      </div>
    </div>

    <!-- Success State -->
    <div id="success" class="card hidden">
      <div class="success">
        <h3>✓ Proposal Created!</h3>
        <p>Waiting for <span id="requiredSigs">2</span> signatures</p>
      </div>
      <div style="margin-top: 1.5rem;">
        <div class="info-row">
          <span class="info-label">Proposal ID</span>
          <span class="info-value" id="proposalId">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Amount</span>
          <span class="info-value" id="proposalAmount">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">To</span>
          <span class="info-value" id="proposalTo">-</span>
        </div>
      </div>
      <button class="btn btn-primary" style="margin-top: 1.5rem;" onclick="viewProposal()">
        View Proposal →
      </button>
    </div>
  </div>

  <script>
    let multisig = null;
    let proposalResult = null;

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const multisigId = params.get('multisigId');

      if (!multisigId) {
        showError('No multisig ID provided');
        return;
      }

      try {
        const res = await fetch(`/v1/multisigs/${multisigId}`);
        const data = await res.json();

        if (!data.success) {
          showError(data.error?.message || 'Failed to load multisig');
          return;
        }

        multisig = data.data;
        showForm();
      } catch (e) {
        showError('Failed to connect to API');
      }
    }

    function showError(msg) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
      document.getElementById('errorMessage').textContent = msg;
    }

    function showForm() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('form').classList.remove('hidden');

      document.getElementById('multisigName').textContent = multisig.name;
      document.getElementById('fromAddress').textContent = 
        multisig.address.slice(0, 12) + '...' + multisig.address.slice(-8);
      
      const totalSats = parseInt(multisig.balance?.total || '0');
      document.getElementById('balance').textContent = totalSats.toLocaleString() + ' sats';
      document.getElementById('availableSats').textContent = totalSats.toLocaleString();
      document.getElementById('threshold').textContent = 
        `${multisig.threshold} of ${multisig.agents?.length || '?'}`;
    }

    // Show/hide password field based on visibility selection
    document.querySelectorAll('input[name="visibility"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const passwordGroup = document.getElementById('passwordGroup');
        if (e.target.value === 'password') {
          passwordGroup.classList.remove('hidden');
        } else {
          passwordGroup.classList.add('hidden');
        }
      });
    });

    async function submitProposal() {
      const recipient = document.getElementById('recipient').value.trim();
      const amount = parseInt(document.getElementById('amount').value);
      const note = document.getElementById('note').value.trim();
      const visibility = document.querySelector('input[name="visibility"]:checked').value;
      const password = document.getElementById('proposalPassword').value;

      if (!recipient) {
        alert('Please enter a recipient address');
        return;
      }

      if (!amount || amount < 546) {
        alert('Minimum amount is 546 sats (dust limit)');
        return;
      }

      if (visibility === 'password' && !password) {
        alert('Please enter a password for password-protected proposals');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const payload = {
          multisigId: multisig.id,
          outputs: [{ address: recipient, amount }],
          note: note || undefined,
          visibility,
        };
        if (visibility === 'password') {
          payload.password = password;
        }

        const res = await fetch('/v1/proposals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (!data.success) {
          alert(data.error?.message || 'Failed to create proposal');
          btn.disabled = false;
          btn.textContent = 'Create Proposal';
          return;
        }

        proposalResult = data.data;
        showSuccess();
      } catch (e) {
        alert('Network error');
        btn.disabled = false;
        btn.textContent = 'Create Proposal';
      }
    }

    function showSuccess() {
      document.getElementById('form').classList.add('hidden');
      document.getElementById('success').classList.remove('hidden');

      document.getElementById('requiredSigs').textContent = multisig.threshold;
      document.getElementById('proposalId').textContent = proposalResult.id.slice(0, 8) + '...';
      document.getElementById('proposalAmount').textContent = 
        proposalResult.outputs[0].amount.toLocaleString() + ' sats';
      document.getElementById('proposalTo').textContent = 
        proposalResult.outputs[0].address.slice(0, 12) + '...';
    }

    function viewProposal() {
      window.location.href = `/p/${proposalResult.id}`;
    }

    init();
  </script>
</body>
</html>
