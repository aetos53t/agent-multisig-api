<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quorum - Proposal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a0a0a;
      --card: #111;
      --border: #222;
      --text: #fff;
      --text-muted: #888;
      --pink: #ec4899;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }
    
    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--pink);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }
    
    .logo-text { font-size: 20px; font-weight: 700; }
    
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    
    .status-badge.pending { background: rgba(234, 179, 8, 0.15); color: var(--yellow); }
    .status-badge.ready { background: rgba(59, 130, 246, 0.15); color: var(--blue); }
    .status-badge.finalized { background: rgba(168, 85, 247, 0.15); color: #a855f7; }
    .status-badge.broadcast { background: rgba(34, 197, 94, 0.15); color: var(--green); }
    .status-badge.confirmed { background: rgba(34, 197, 94, 0.15); color: var(--green); }
    
    .amount { font-size: 32px; font-weight: 700; color: var(--pink); margin: 16px 0; }
    .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .value { font-family: monospace; font-size: 14px; word-break: break-all; }
    .row { margin-bottom: 16px; }
    
    .signer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border-radius: 10px;
      margin-bottom: 8px;
    }
    
    .signer-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .signer-icon.signed { background: var(--green); color: #000; }
    .signer-icon.pending { background: var(--border); color: var(--text-muted); }
    
    .signer-info { flex: 1; }
    .signer-name { font-weight: 600; font-size: 14px; }
    .signer-status { font-size: 12px; color: var(--text-muted); }
    .signer-status.signed { color: var(--green); }
    
    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      text-align: center;
    }
    
    .btn-pink { background: var(--pink); color: #000; }
    .btn-pink:hover { opacity: 0.9; }
    .btn-gray { background: var(--border); color: var(--text); }
    .btn-full { width: 100%; }
    
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      color: var(--text-muted);
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .error-card {
      text-align: center;
      padding: 40px;
    }
    
    .error-icon { font-size: 48px; margin-bottom: 16px; }
    
    .sighash-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin: 16px 0;
    }
    
    .sighash-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .sighash-value { font-family: monospace; font-size: 13px; word-break: break-all; color: var(--pink); }
    
    .tx-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--green);
      border-radius: 10px;
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
      margin-top: 16px;
    }
    
    .tx-link:hover { background: rgba(34, 197, 94, 0.2); }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="/" class="logo">
        <div class="logo-icon">Q</div>
        <span class="logo-text">Quorum</span>
      </a>
      <span id="status-badge" class="status-badge pending">Loading...</span>
    </header>
    
    <!-- Loading -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <span>Loading proposal...</span>
    </div>
    
    <!-- Error -->
    <div id="error" class="card error-card hidden">
      <div class="error-icon">❌</div>
      <h2 id="error-title">Error</h2>
      <p id="error-message" style="color: var(--text-muted); margin-top: 8px;"></p>
      <a href="/" class="btn btn-gray" style="margin-top: 24px;">← Back to Home</a>
    </div>
    
    <!-- Proposal View -->
    <div id="proposal-view" class="hidden">
      <!-- Amount Card -->
      <div class="card">
        <div class="label">Sending</div>
        <div class="amount" id="amount">0 sats</div>
        <div class="row">
          <div class="label">To</div>
          <div class="value" id="recipient">—</div>
        </div>
        <div class="row">
          <div class="label">Fee</div>
          <div class="value" id="fee">—</div>
        </div>
      </div>
      
      <!-- Signers Card -->
      <div class="card">
        <div class="label" style="margin-bottom: 12px;">Signatures (<span id="sig-count">0</span>/<span id="threshold">2</span>)</div>
        <div id="signers-list"></div>
      </div>
      
      <!-- Sighash (for signers) -->
      <div class="card" id="sighash-card">
        <div class="label">Sighash to Sign</div>
        <div class="sighash-box">
          <div class="sighash-value" id="sighash">—</div>
        </div>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
          Sign this hash with your private key and submit below.
        </p>
        <div style="margin-bottom: 12px;">
          <div class="label">Your Agent ID</div>
          <input type="text" id="sign-agent-id" placeholder="invite-xxxxx-yyyyyy" 
            style="width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: monospace; font-size: 14px;">
        </div>
        <div style="margin-bottom: 16px;">
          <div class="label">Your Signature (64-byte Schnorr hex)</div>
          <input type="text" id="sign-signature" placeholder="64-byte signature..." 
            style="width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: monospace; font-size: 14px;">
        </div>
        <button class="btn btn-pink btn-full" onclick="submitSignature()">Submit Signature</button>
      </div>
      
      <!-- TX Link (after broadcast) -->
      <a id="tx-link" class="tx-link hidden" href="#" target="_blank">
        <span>🔗</span> View Transaction on Mempool →
      </a>
    </div>
  </div>

  <script>
    const API = '';
    const proposalId = window.location.pathname.split('/').pop();
    let proposal = null;
    let multisig = null;
    let pollInterval = null;
    
    async function init() {
      if (!proposalId || proposalId === 'p') {
        showError('Invalid URL', 'No proposal ID provided');
        return;
      }
      
      await loadProposal();
      
      // Poll for updates every 5 seconds
      pollInterval = setInterval(loadProposal, 5000);
    }
    
    async function loadProposal() {
      try {
        const res = await fetch(`${API}/v1/proposals/${proposalId}`);
        const data = await res.json();
        
        if (!data.success) {
          showError('Proposal Not Found', data.error?.message || 'Could not load proposal');
          if (pollInterval) clearInterval(pollInterval);
          return;
        }
        
        proposal = data.data;
        
        // Fetch multisig for agent details
        const msRes = await fetch(`${API}/v1/multisigs/${proposal.multisigId}`);
        const msData = await msRes.json();
        if (msData.success) {
          multisig = msData.data;
        }
        
        renderProposal();
        
      } catch (e) {
        console.error('Load error:', e);
        showError('Error', 'Failed to load proposal');
        if (pollInterval) clearInterval(pollInterval);
      }
    }
    
    function renderProposal() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.add('hidden');
      document.getElementById('proposal-view').classList.remove('hidden');
      
      // Status badge
      const badge = document.getElementById('status-badge');
      badge.textContent = proposal.status.charAt(0).toUpperCase() + proposal.status.slice(1);
      badge.className = `status-badge ${proposal.status}`;
      
      // Amount
      const totalAmount = proposal.outputs?.reduce((s, o) => s + parseInt(o.amount || 0), 0) || 0;
      document.getElementById('amount').textContent = totalAmount.toLocaleString() + ' sats';
      
      // Recipient
      const recipient = proposal.outputs?.[0]?.address || '—';
      document.getElementById('recipient').textContent = recipient;
      
      // Fee
      document.getElementById('fee').textContent = (proposal.fee || '—') + ' sats';
      
      // Signatures
      const sigCount = proposal.signatures?.length || 0;
      const threshold = multisig?.threshold || 2;
      document.getElementById('sig-count').textContent = sigCount;
      document.getElementById('threshold').textContent = threshold;
      
      // Signers list
      const signersList = document.getElementById('signers-list');
      const agents = multisig?.agents || [];
      const signedAgents = proposal.signatures?.map(s => s.agentId) || [];
      
      signersList.innerHTML = agents.map(agent => {
        const hasSigned = signedAgents.includes(agent.id);
        return `
          <div class="signer">
            <div class="signer-icon ${hasSigned ? 'signed' : 'pending'}">
              ${hasSigned ? '✓' : '?'}
            </div>
            <div class="signer-info">
              <div class="signer-name">${agent.name || agent.id}</div>
              <div class="signer-status ${hasSigned ? 'signed' : ''}">${hasSigned ? 'Signed ✓' : 'Pending signature'}</div>
            </div>
          </div>
        `;
      }).join('');
      
      // Sighash
      const sighash = proposal.sighashes?.[0]?.sighash;
      if (sighash) {
        document.getElementById('sighash').textContent = sighash;
      }
      
      // Hide sighash card if already broadcast/confirmed
      if (['broadcast', 'confirmed'].includes(proposal.status)) {
        document.getElementById('sighash-card').classList.add('hidden');
      } else {
        document.getElementById('sighash-card').classList.remove('hidden');
      }
      
      // TX link
      if (proposal.txid) {
        const txLink = document.getElementById('tx-link');
        txLink.href = `https://mempool.space/tx/${proposal.txid}`;
        txLink.classList.remove('hidden');
      }
    }
    
    function showError(title, message) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('proposal-view').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-message').textContent = message;
      document.getElementById('status-badge').textContent = 'Error';
      document.getElementById('status-badge').className = 'status-badge';
    }
    
    async function submitSignature() {
      const agentId = document.getElementById('sign-agent-id').value.trim();
      const signature = document.getElementById('sign-signature').value.trim();
      
      if (!agentId || !signature) {
        alert('Please enter both Agent ID and Signature');
        return;
      }
      
      if (signature.length !== 128) {
        alert('Signature must be 128 hex characters (64 bytes)');
        return;
      }
      
      try {
        const res = await fetch(`${API}/v1/proposals/${proposalId}/sign`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agentId, signature }),
        });
        
        const data = await res.json();
        
        if (data.success) {
          alert(`✓ Signature submitted! ${data.data.signatureCount}/${multisig?.threshold || 2} signatures.`);
          document.getElementById('sign-signature').value = '';
          await loadProposal();
          
          // Auto-broadcast if finalized
          if (data.data.status === 'finalized' && data.data.thresholdMet) {
            if (confirm('All signatures collected! Broadcast transaction now?')) {
              await broadcastTx();
            }
          }
        } else {
          alert(`Error: ${data.error?.message || 'Failed to submit signature'}`);
        }
      } catch (e) {
        alert(`Error: ${e.message}`);
      }
    }
    
    async function broadcastTx() {
      try {
        const res = await fetch(`${API}/v1/proposals/${proposalId}/broadcast`, {
          method: 'POST',
        });
        
        const data = await res.json();
        
        if (data.success) {
          alert(`✓ Transaction broadcast!\n\nTXID: ${data.data.txid}`);
          await loadProposal();
        } else {
          alert(`Error: ${data.error?.message || 'Failed to broadcast'}`);
        }
      } catch (e) {
        alert(`Error: ${e.message}`);
      }
    }
    
    // Start
    init();
  </script>
</body>
</html>
