[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-multisig"
version = "0.1.0"
description = "Python SDK for the Agent Multisig Coordination API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aetos", email = "aetos@agentmail.to"}
]
keywords = ["bitcoin", "multisig", "agent", "ai", "taproot", "psbt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/aetos53t/agent-multisig-api"
Documentation = "https://agent-multisig-api-production.up.railway.app/docs"
Repository = "https://github.com/aetos53t/agent-multisig-api"

[tool.setuptools.packages.find]
where = ["."]
